<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{
      site.title }}{% endif %}
    </title>
    <link
      rel="icon"
      type="image/png"
      href="{{ '/assets/images/goose-wedding.png' | relative_url }}"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      href="{{ '/assets/images/goose-wedding.png' | relative_url }}"
      sizes="180x180"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    {% feed_meta %} {% seo %}
  </head>
  <body>
    <nav class="site-nav">
      <ul>
        {% assign nav_sections = site.sections | sort: "order" %} {% for section
        in nav_sections %} {% if section.anchor %}
        <li><a href="#{{ section.anchor }}">{{ section.nav }}</a></li>
        {% endif %} {% endfor %}
      </ul>
    </nav>
    <main>{{ content }}</main>
  </body>
</html>
